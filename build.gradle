plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'de.winniepat'
version = '1.5'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.winniepat.de/releases' }
}

def mcApiGroup = project.findProperty('mcApiGroup') ?: 'com.destroystokyo.paper'
def mcVersion = project.findProperty('mcVersion') ?: '1.16.5-R0.1-SNAPSHOT'
def minJavaVersion = 21

dependencies {
    compileOnly("${mcApiGroup}:paper-api:${mcVersion}")

    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        exclude group: 'org.bukkit', module: 'bukkit'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation "de.winniepat:modrinthupdatechecker:0.0.2"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks {
    runServer {
        minecraftVersion("1.21.11")
    }
}

java {
    def javaVersion = JavaVersion.toVersion(minJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion

    toolchain {
        languageVersion = JavaLanguageVersion.of(minJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (minJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(minJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.named('shadowJar') {
    archiveClassifier.set('all')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('runServer') {
    minecraftVersion('1.21.11')

    dependsOn tasks.named('shadowJar')

    pluginJars.from(tasks.named('shadowJar').flatMap {
        it.archiveFile
    })
}